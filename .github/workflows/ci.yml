name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Same shell everywhere (Git Bash on Windows) so the step scripts stay identical.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # No lifecycle scripts of any dependency run in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      # Hosted Windows runners are elevated; the product refuses to run elevated
      # (T14, not relaxed), so tests run as a non-elevated local user there.
      - run: pnpm test
        if: runner.os != 'Windows'
      - name: pnpm test (non-elevated user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-win-nonelevated.ps1
      - name: Supply-chain script tests
        run: node --test scripts/*.test.mjs
      # Weak-filesystem tests: a loop-mounted vfat image (no POSIX modes, no
      # owner, no hardlinks). The vfat-gated tests are added later; until then
      # LEDGER_TEST_VFAT is ignored and this re-runs the suite unchanged.
      - name: Weak-FS tests (vfat loop mount)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/ledger-vfat.img"
          mnt="$RUNNER_TEMP/ledger-vfat"
          command -v mkfs.vfat >/dev/null || sudo apt-get install -y --no-install-recommends dosfstools
          truncate -s 64M "$img"
          mkfs.vfat "$img" >/dev/null
          mkdir -p "$mnt"
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$img" "$mnt"
          trap 'sudo umount "$mnt" || true' EXIT
          LEDGER_TEST_VFAT=1 LEDGER_TEST_VFAT_DIR="$mnt" pnpm test
