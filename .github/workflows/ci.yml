name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Same shell everywhere (Git Bash on Windows) so the step scripts stay identical.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # No lifecycle scripts of any dependency run in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      # Diagnostics only (never fails): how long does the fixed trust probe take on this runner?
      - name: Windows PowerShell probe timing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          foreach ($i in 1..3) {
            $t = Measure-Command { & $ps -NoProfile -NonInteractive -NoLogo -Command '(Get-Acl -LiteralPath $env:SystemRoot).Sddl.Length' | Out-String | Write-Host }
            Write-Host "probe run $i : $([int]$t.TotalMilliseconds) ms"
          }
      # Hosted Windows runners are elevated; the product refuses to run elevated
      # (T14, not relaxed), so tests run as a non-elevated local user there.
      - run: pnpm test
        if: runner.os != 'Windows'
      - name: pnpm test (non-elevated user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-win-nonelevated.ps1
      - name: Supply-chain script tests
        run: node --test scripts/*.test.mjs
      # Long randomised sync soak (docs/f3b-b6-plan.md): the default `pnpm test` run is the short 30-op version.
      # Reproduce a failure with the SOAK_SEED printed in the log.
      - name: Soak (long)
        if: runner.os == 'Linux'
        env:
          SOAK_ITERATIONS: '400'
          SOAK_BUDGET_MS: '240000'
        run: node --test --test-timeout=600000 packages/hub/src/sync/soak.test.ts
      # Report-only via the script's own -NoFail (scripts/workflow-pins.test.mjs forbids continue-on-error): do the sync threat + soak suites even run on Windows? (the sync tests are POSIX-gated
      # unless LEDGER_TEST_SYNC_WIN32=1). UNVERIFIED: brace glob handling of the non-elevated runner (fallback:
      # two steps) and whether the env reaches the non-elevated child.
      - name: Sync threat + soak (Windows, report-only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LEDGER_TEST_SYNC_WIN32: '1'
          SOAK_ITERATIONS: '40'
        run: ./scripts/ci-win-nonelevated.ps1 -Files 'packages/hub/src/sync/{threat.*,soak}.test.ts' -ExtraArgs '--test-concurrency=1' -MaxMinutes 8 -NoFail
      # Weak-filesystem tests: a loop-mounted vfat image (no POSIX modes, no
      # owner, no hardlinks). The vfat-gated tests are added later; until then
      # LEDGER_TEST_VFAT is ignored and this re-runs the suite unchanged.
      - name: Weak-FS tests (vfat loop mount)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/ledger-vfat.img"
          mnt="$RUNNER_TEMP/ledger-vfat"
          command -v mkfs.vfat >/dev/null || sudo apt-get install -y --no-install-recommends dosfstools
          truncate -s 64M "$img"
          mkfs.vfat "$img" >/dev/null
          mkdir -p "$mnt"
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$img" "$mnt"
          trap 'sudo umount "$mnt" || true' EXIT
          LEDGER_TEST_VFAT=1 LEDGER_TEST_VFAT_DIR="$mnt" pnpm test
